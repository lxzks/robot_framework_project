name: 车载自动化测试 CI

# 触发方式：
#   - pull_request：pytest 30 个单测 + 文档数字一致性检查 + RF 冒烟集（29 条，约 2 分钟/版本）—— 快速反馈
#   - push（main/master）：完整跑全量 276 用例（约 6 分钟/版本；CI 无缓存约 8 分钟/版本）
#   - nightly：完整跑 + 报告/覆盖率归档
#   - nightly（每天北京时间 02:00）：完整跑 + 归档报告与覆盖率
#   - 手动触发
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 18 * * *'      # UTC 18:00 = 北京时间 02:00
  workflow_dispatch:

# 同一分支的重复 push 只保留最新一次，避免排队浪费（手动触发也不取消）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 仿真座舱测试（276 用例 · Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Python 版本矩阵：3.12 = CI 主版本（依赖最稳），3.14 = 本地开发验证版本。
    # fail-fast: false —— 一个版本失败不影响另一个版本跑完（矩阵的价值是"一次看全"）。
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装系统依赖（PySide6 运行库）
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: pytest 单元测试（快速失败）
        # 纯单元/逻辑测试，毫秒级；放在 RF 全量之前，跑挂了立刻失败，
        # 不用等 6 分钟仿真测试跑完（失败快速反馈）。pytest 不入 requirements.txt，
        # 在 CI 里单独装（本地 venv 已自带）。
        run: |
          python -m pip install pytest
          python -m pytest tools/pytest_style -q

      - name: 文档数字一致性检查
        # 防止 README/docs/KNOWN_ISSUES 的"用例数/需求数/教程篇数"随开发漂移；
        # 规则见 tools/check_docs_consistency.py（现场统计 + 过期数字黑名单）。
        run: python tools/check_docs_consistency.py

      - name: 测试规范一致性校验（需求/自动化引用）
        run: python test_spec_check.py

      - name: 生成测试用例（DBC → 边界值 / pairwise）
        run: python generate_testcases.py

      - name: 运行测试（PR=冒烟快速反馈；push/nightly=全量+报告）
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR：只跑 smoke 标签冒烟集（快速反馈），全量由 nightly / push main 覆盖"
            python run_tests.py --tag smoke
          else
            python run_tests.py --report
          fi

      - name: 上传测试产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # PR 冒烟也有 output.xml/log；全量另有 report/coverage/trace 三份 HTML
          name: test-results-${{ github.run_number }}-py${{ matrix.python-version }}
          path: |
            results/
          retention-days: 30

      - name: 生成任务摘要（在 Actions 页面直接看结果）
        if: always()
        run: |
          {
            echo "## 车载自动化测试结果"
            echo ""
            if [ -f results/test_summary.html ]; then
              echo "交付报告与用例明细见下方 Artifact（results/）"
            fi
            echo ""
            echo "### 需求追溯矩阵"
            echo '```'
            python trace_matrix.py || true
            echo '```'
            echo "### 覆盖率"
            echo '```'
            python coverage_report.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
