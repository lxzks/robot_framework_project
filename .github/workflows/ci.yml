name: 车载自动化测试 CI

# 触发方式：
#   - push / PR：快速反馈（跑全部用例，约 1 分钟）
#   - nightly（每天北京时间 02:00）：完整跑 + 归档报告与覆盖率
#   - 手动触发
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 18 * * *'      # UTC 18:00 = 北京时间 02:00
  workflow_dispatch:

jobs:
  test:
    name: 仿真座舱测试（50+ 用例）
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装系统依赖（PySide6 运行库）
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 测试规范一致性校验（需求/自动化引用）
        run: python test_spec_check.py

      - name: 生成测试用例（DBC → 边界值 / pairwise）
        run: python generate_testcases.py

      - name: 运行测试（含交付报告 + 覆盖率）
        run: python run_tests.py --report

      - name: 上传测试产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            results/
          retention-days: 30

      - name: 生成任务摘要（在 Actions 页面直接看结果）
        if: always()
        run: |
          {
            echo "## 车载自动化测试结果"
            echo ""
            if [ -f results/test_summary.html ]; then
              echo "交付报告与用例明细见下方 Artifact（results/）"
            fi
            echo ""
            echo "### 需求追溯矩阵"
            echo '```'
            python trace_matrix.py || true
            echo '```'
            echo "### 覆盖率"
            echo '```'
            python coverage_report.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
